<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የአሽከርካሪዎች ምዝገባ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 p-4 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-2xl shadow p-6 border border-slate-100">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">የአሽከርካሪ ምዝገባ</h1>
      <p class="text-xs text-slate-500 mt-1">መረጃዎን በትክክል ሞልተው ያጠናቁ</p>
    </div>

    <form id="driverForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ሙሉ ስም (ከነ አያት)</label>
        <input type="text" id="fullName" required placeholder="ሙሉ ስም ያስገቡ"
          class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ስልክ ቁጥር</label>
        <input type="tel" id="phoneNumber" required placeholder="09... ወይም 07..."
          class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ኮድ</label>
          <select id="plateCode" class="w-full px-2 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="ኮድ 2">ኮድ 2</option>
            <option value="ኮድ 3">ኮድ 3</option>
            <option value="ኮድ 1">ኮድ 1</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">የታርጋ ቁጥር</label>
          <input type="text" id="plateNumber" required placeholder="A12345 AA"
            class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">የተሽከርካሪ ዓይነት እና ሞዴል</label>
        <input type="text" id="vehicleModel" required placeholder="ለምሳሌ፦ Toyota Vitz 2018"
          class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition-all shadow mt-2">
        ምዝገባውን ላክ
      </button>
    </form>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    document.getElementById("driverForm").addEventListener("submit", (e) => {
      e.preventDefault();
      
      const payload = {
        fullName: document.getElementById("fullName").value.trim(),
        phoneNumber: document.getElementById("phoneNumber").value.trim(),
        plateCode: document.getElementById("plateCode").value,
        plateNumber: document.getElementById("plateNumber").value.trim().toUpperCase(),
        vehicleModel: document.getElementById("vehicleModel").value.trim()
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert("መረጃው ተልኳል፦ " + JSON.stringify(payload));
      }
    });
  </script>
</body>
</html>
